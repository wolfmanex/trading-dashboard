name: Watchdog and evening recap

on:
  schedule:
    # Watchdog, twice in case GitHub drops one: 13:04 and 13:19 UTC on weekdays, 23 and 38 minutes after
    # the morning scan is due (9:04/9:19 New York in summer, 8:04/8:19 in winter).
    - cron: "4,19 13 * * 1-5"
    # Evening recap: 21:17 UTC, after the close in both summer (17:17 New York) and winter (16:17).
    - cron: "17 21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "watchdog or recap"
        default: recap

concurrency: daily-check

permissions:
  contents: write   # the recap saves the updated signal log
  actions: write    # the watchdog lists runs and starts a missed scan

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.schedule == '17 21 * * 1-5' && 'recap' || github.event.schedule && 'watchdog' || inputs.mode }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Watchdog
        if: env.MODE == 'watchdog'
        run: python daily_check.py watchdog
      - name: Check out the signal log branch
        if: env.MODE == 'recap'
        run: |
          if git ls-remote --exit-code --heads origin signal-log; then
            git fetch origin signal-log:refs/remotes/origin/signal-log
            git worktree add -B signal-log signal-log-data origin/signal-log
          else
            mkdir signal-log-data
          fi
      - name: Recap
        if: env.MODE == 'recap'
        run: python daily_check.py recap --log signal-log-data/signal_log.csv --journal signal-log-data/journal.csv
      - name: Save the signal log
        if: env.MODE == 'recap' && hashFiles('signal-log-data/signal_log.csv') != ''
        working-directory: signal-log-data
        run: |
          git add signal_log.csv
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Signal log close $(TZ=America/New_York date +%F)"
          # The scan and the intraday alerts also push to this branch; rebase onto them if they got there first.
          for attempt in 1 2 3; do
            git push origin signal-log && exit 0
            git pull --rebase origin signal-log
          done
          exit 1
