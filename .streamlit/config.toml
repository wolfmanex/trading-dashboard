# .streamlit/config.toml
# "Ledger Board" theme: light, flat, square boxes with black outlines and strong colours.
# styles.css carries the outlines, offset shadows and header strips; keep the colours here in sync with it.
[theme]
base = "light"
primaryColor = "#1F3DFF"
backgroundColor = "#E9ECF0"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111418"
linkColor = "#1F3DFF"
borderColor = "#111418"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "none"
buttonRadius = "none"
font = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap"
headingFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
headingFontWeights = [900, 800, 800, 800, 700, 700]
metricValueFontWeight = 700
greenColor = "#00A85A"
redColor = "#E8173A"
yellowColor = "#FFAD1F"
blueColor = "#1F3DFF"
greenBackgroundColor = "#CFF3DF"
redBackgroundColor = "#FFD3DA"
yellowBackgroundColor = "#FFE9A8"
blueBackgroundColor = "#DCE2FF"
greenTextColor = "#00552D"
redTextColor = "#8A0019"
yellowTextColor = "#5C3B00"
blueTextColor = "#0B1C99"
dataframeBorderColor = "#D3D9E1"
dataframeHeaderBackgroundColor = "#FFAD1F"
dataframeHeaderTextColor = "#111418"

[theme.sidebar]
backgroundColor = "#DDE2E9"
secondaryBackgroundColor = "#FFFFFF"
